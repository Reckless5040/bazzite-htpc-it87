# Options for frankcrawford's it87 driver. Override locally in
# /etc/modprobe.d/it87.conf instead of rebuilding the image.
#
# Many Gigabyte/ASRock boards need this when dmesg shows an ACPI resource conflict:
# options it87 ignore_resource_conflict=1
#
# Force a chip ID for unsupported/unknown chips:
# options it87 force_id=0x8689
